    <title>Swivel</title>

  <body>
    <div id="root"></div>

         dist/sidepanel.html — the exact path manifest.json's side_panel
         default_path points at. An entry under src/ would be emitted at
         dist/src/sidepanel/index.html and break the manifest. -->

  </body>
